# tginfo-web: статика интерфейса и /api → tginfo-api. Внутри сервера, за infra-nginx.
#
# X-Forwarded-For передаётся как пришёл: infra-nginx уже записал туда адрес клиента,
# а API доверяет ровно одному прокси (TRUST_PROXY). Дописать сюда адрес infra-nginx —
# значит, лимит попыток входа считался бы по нему, а не по клиенту.

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Имена контейнеров разрешаются при каждом запросе: API можно пересоздавать без перезапуска.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Ручная вставка статьи — до 10 МБ тела в API.
    client_max_body_size 12m;

    location /api/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        set $tginfo_api tginfo-api:4100;
        proxy_pass http://$tginfo_api$request_uri;
    }

    # Service worker и оболочка — без кэша: иначе обновление версии не дойдёт до браузера.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
