# TG_Info на общем infra-nginx сервера quantor (ADR-013). Имя портала — __DOMAIN__:
# перед копированием заменить (deploy/README.md, шаг 5).
#
#   __DOMAIN__  /  → tginfo-web:8080 (статика и /api → tginfo-api:4100)
#
# Кладётся в /opt/infra/nginx/conf.d/ ПОСЛЕ выпуска сертификата. Файлы Quantor не трогаются.
# Откат: удалить файл, `nginx -t`, `nginx -s reload`.

# Вход: перебор токена упирается сюда раньше, чем в лимит API.
limit_req_zone $binary_remote_addr zone=tginfo_auth:10m rate=10r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tginfo_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Портал собирает закрытые сведения: поисковикам его не показываем.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 12m;

    # Адрес клиента перезаписывается, а не дописывается: nginx — первый хоп, и цепочку,
    # присланную клиентом, принимать нельзя — ею обошли бы лимит попыток входа.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location = /api/auth/login {
        limit_req zone=tginfo_auth burst=5 nodelay;
        limit_req_status 429;
        set $tginfo_web tginfo-web:8080;
        proxy_pass http://$tginfo_web$request_uri;
    }

    location / {
        proxy_read_timeout 120s;
        set $tginfo_web tginfo-web:8080;
        proxy_pass http://$tginfo_web$request_uri;
    }
}
