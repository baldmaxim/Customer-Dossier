# /etc/ssh/sshd_config.d/tginfo-llmtunnel.conf на quantor.
#
# Пользователь llmtunnel нужен только домашнему ПК с LM Studio: он держит обратный туннель
# 172.30.0.1:1234 → 127.0.0.1:1234 (LM Studio). Оболочки, TTY и прямых пробросов нет;
# какой адрес слушать, дополнительно ограничивает permitlisten в authorized_keys:
#
#   restrict,port-forwarding,permitlisten="172.30.0.1:1234" ssh-ed25519 AAAA… tginfo-llm-tunnel
#
# 172.30.0.1 — шлюз внутренней сети tginfo (docker-compose.yml). Снаружи этот адрес
# недоступен: он есть только на мосту br-tginfo, а ufw пускает к порту лишь 172.30.0.0/24.
Match User llmtunnel
    AllowTcpForwarding remote
    GatewayPorts clientspecified
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    ForceCommand /usr/sbin/nologin
# Файл подключается в начале sshd_config: без сброса блок Match забрал бы себе основные настройки.
Match all
