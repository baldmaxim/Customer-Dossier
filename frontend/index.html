<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Досье Заказчика</title>
    <meta name="description" content="Локальный портал досье участников строительного рынка" />
    <meta name="color-scheme" content="light dark" />
    <!-- ИНН, ОГРН и суммы — не телефоны: без этого iOS делает из них tel-ссылки. -->
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Шрифт — Inter из бандла (src/styles/fonts.css), внешних запросов нет. Кириллица нужна на любой странице:
         preload, а не ожидание разбора CSS (07.10.2026). Vite подставляет тот же файл assets/, что и url() в
         fonts.css; crossorigin обязателен — иначе предзагрузка не совпадёт и шрифт скачается дважды. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter/files/inter-cyrillic-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- apple-mobile-web-app-capable устарел, но iOS до 17 читает только его. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- default, а не black-translucent: при translucent часы и статус-бар
         рисуются белым поверх контента и на светлой теме исчезают. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Досье" />
    <!-- Цвет системной панели = --chrome из src/index.css (цвет шапки): иначе между ними шов.
         Значения повторены в скрипте ниже и в manifest.json; совпадение проверяет
         src/test/themeColor.test.ts. -->
    <meta name="theme-color" content="#fdfdfd" />

    <script>
      // Тема ставится до первой отрисовки — иначе при загрузке мигает светлым.
      // Сохранённое значение проверяется: мусор в localStorage не должен давать
      // data-theme="undefined" и страницу без токенов тёмной темы.
      (function () {
        let theme = 'light';
        try {
          const stored = localStorage.getItem('theme');
          if (stored === 'dark' || stored === 'light') theme = stored;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {
          // Хранилище недоступно (приватный режим) — остаётся светлая.
        }
        document.documentElement.setAttribute('data-theme', theme);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#14171e' : '#fdfdfd');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
