<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Досье Заказчика">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a7bfa"/>
      <stop offset="1" stop-color="#1b3ccd"/>
    </linearGradient>
  </defs>
  <!-- Плитка. Фон непрозрачный: прозрачный PNG на iOS даёт чёрный квадрат. -->
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
  <!-- Монограмма «Д»: геометрическая, две фигуры — читается на 16 px. -->
  <g transform="translate(32 32) scale(0.9) translate(-32 -32)">
    <path fill="#ffffff" fill-rule="evenodd"
          d="M24 15H46V39H50V50H42V45H22V50H14V39H18Z
             M31 22H39V39H26Z"/>
  </g>
