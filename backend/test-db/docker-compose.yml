# Изолированная PostgreSQL только для интеграционных тестов TG_Info.
# Порт открыт только на 127.0.0.1. Данные не сохраняются между пересозданиями.
#
#   docker compose -f backend/test-db/docker-compose.yml up -d --wait
#   docker compose -f backend/test-db/docker-compose.yml down
#
# Без монтирования каталогов: bind-mount требует File Sharing в Docker Desktop
# и на части машин падает. Метку тестовой цели ставит healthcheck — контейнер
# становится healthy только после того, как метка на месте.
#
# Учётные данные тестовые и не являются секретом: база ничего, кроме тестов, не хранит.

services:
  tg-info-test-db:
    image: postgres:17-alpine
    container_name: tg-info-test-db
    environment:
      POSTGRES_USER: tg_test
      POSTGRES_PASSWORD: tg_test
      POSTGRES_DB: tg_info_test
    ports:
      - '127.0.0.1:55433:5432'
    labels:
      project: tg-info
      purpose: test-only
    healthcheck:
      # Метка tg_info:test-target: без неё guard интеграционных тестов откажет.
      # Ставится один раз; дальше проверка только читает.
      test:
        - CMD-SHELL
        - >-
          pg_isready -U tg_test -d tg_info_test &&
          (psql -U tg_test -d tg_info_test -tAc "SELECT shobj_description(oid,'pg_database') FROM pg_database WHERE datname='tg_info_test'" | grep -qx 'tg_info:test-target' ||
           psql -U tg_test -d tg_info_test -qc "COMMENT ON DATABASE tg_info_test IS 'tg_info:test-target'")
      interval: 3s
      timeout: 5s
      retries: 30
